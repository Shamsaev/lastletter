# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: last-letter
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      # Website mode: players join by link with just a name (no Discord login).
      - key: ALLOW_GUESTS
        value: "1"
      - key: REPORT_TZ
        value: Europe/Moscow
      - key: REPORT_TIME
        value: "23:59"
